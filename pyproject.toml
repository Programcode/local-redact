[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-redact"
version = "0.1.0"
description = "Local-first document redaction engine: bilingual (HU/EN) Presidio core, encrypted mapping DB, batch mode."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7,<3.9",
    "huspacy>=0.12",
    "sqlcipher3-binary>=0.5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "PyMuPDF>=1.24",
    "extract-msg>=0.48",
    "beautifulsoup4>=4.12",
    "platformdirs>=4.2",
    "keyring>=25.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
local-redact = "local_redact.cli:main"
local-redact-web = "local_redact.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_redact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (large synthetic batch)",
]
